<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - WMS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-indigo-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full text-2xl mb-3 shadow-inner">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">WMS - Quản lý kho</h1>
            <p class="text-sm text-gray-500 mt-1">Đăng nhập hoặc đăng ký tài khoản để vào hệ thống</p>
        </div>

        <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-lg mb-5 text-sm font-semibold">
            <button id="tab-login" onclick="switchTab('login')" class="py-2 rounded-md bg-white shadow text-blue-700">Đăng nhập</button>
            <button id="tab-register" onclick="switchTab('register')" class="py-2 rounded-md text-gray-500">Đăng ký</button>
        </div>

        <div id="msg" class="hidden text-xs text-center font-medium rounded-lg p-2.5 mb-4"></div>

        <!-- Đăng nhập -->
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                <input type="text" id="l-username" required autocomplete="username"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" id="l-password" required autocomplete="current-password"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">Đăng nhập</button>
        </form>

        <!-- Đăng ký -->
        <form id="register-form" class="space-y-4 hidden">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Họ và tên</label>
                <input type="text" id="r-fullname" required minlength="2" maxlength="100"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                <input type="text" id="r-username" required minlength="3" maxlength="50" autocomplete="username"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="chữ thường không dấu, số, . _">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu (tối thiểu 6 ký tự)</label>
                <input type="password" id="r-password" required minlength="6" autocomplete="new-password"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Vai trò mong muốn</label>
                <select id="r-role" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white">
                    <option value="worker">Công nhân kho (do Thủ kho/Admin duyệt)</option>
                    <option value="manager">Thủ kho (do Admin duyệt)</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm">Gửi yêu cầu đăng ký</button>
        </form>
    </div>

    <script>
        function show(text, isError) {
            const m = document.getElementById('msg');
            m.textContent = text;
            m.className = 'text-xs text-center font-medium rounded-lg p-2.5 mb-4 ' +
                (isError ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200');
        }

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('login-form').classList.toggle('hidden', !isLogin);
            document.getElementById('register-form').classList.toggle('hidden', isLogin);
            document.getElementById('tab-login').className = 'py-2 rounded-md ' + (isLogin ? 'bg-white shadow text-blue-700' : 'text-gray-500');
            document.getElementById('tab-register').className = 'py-2 rounded-md ' + (!isLogin ? 'bg-white shadow text-blue-700' : 'text-gray-500');
            document.getElementById('msg').className = 'hidden';
        }

        function errText(data) {
            if (!data) return 'Có lỗi xảy ra';
            if (Array.isArray(data.detail)) return data.detail.map(d => d.msg).join('; ');
            return data.detail || data.message || 'Có lỗi xảy ra';
        }

        async function post(url, payload) {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            let data = null;
            try { data = await res.json(); } catch (_) {}
            return { ok: res.ok, data };
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const { ok, data } = await post('/api/auth/login', {
                    username: document.getElementById('l-username').value,
                    password: document.getElementById('l-password').value,
                });
                if (!ok) return show(errText(data), true);
                localStorage.setItem('wms_token', data.token);
                localStorage.setItem('wms_user', JSON.stringify(data.user));
                location.href = data.user.role === 'worker' ? '/mobile' : '/';
            } catch (_) {
                show('Không kết nối được backend. Hãy kiểm tra FastAPI!', true);
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const { ok, data } = await post('/api/auth/register', {
                    full_name: document.getElementById('r-fullname').value,
                    username: document.getElementById('r-username').value,
                    password: document.getElementById('r-password').value,
                    role: document.getElementById('r-role').value,
                });
                show(errText(data), !ok);
                if (ok) e.target.reset();
            } catch (_) {
                show('Không kết nối được backend. Hãy kiểm tra FastAPI!', true);
            }
        });

        // Đã đăng nhập sẵn thì đi thẳng vào hệ thống
        (function () {
            try {
                const u = JSON.parse(localStorage.getItem('wms_user') || 'null');
                if (localStorage.getItem('wms_token') && u) location.href = u.role === 'worker' ? '/mobile' : '/';
            } catch (_) {}
        })();
    </script>
</body>
</html>
