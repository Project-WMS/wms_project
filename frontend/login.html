<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - WMS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="wms-login flex items-center justify-center">

    <main class="auth-card bg-white">
        <div class="text-center mb-6">
            <div class="auth-brand-mark inline-flex items-center justify-center bg-blue-100 text-blue-600 rounded-full text-2xl mb-3 shadow-inner" aria-hidden="true">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">WMS - Quản lý kho</h1>
            <p class="text-sm text-gray-500 mt-1">Đăng nhập hoặc đăng ký tài khoản để vào hệ thống</p>
        </div>

        <div class="auth-tabs mb-5 text-sm font-semibold" role="tablist" aria-label="Chọn hình thức truy cập">
            <button id="tab-login" type="button" role="tab" aria-controls="login-form" aria-selected="true" onclick="switchTab('login')" class="auth-tab">Đăng nhập</button>
            <button id="tab-register" type="button" role="tab" aria-controls="register-form" aria-selected="false" onclick="switchTab('register')" class="auth-tab">Đăng ký</button>
        </div>

        <div id="msg" class="auth-alert hidden mb-4" role="alert" aria-live="assertive" aria-atomic="true"></div>

        <!-- Đăng nhập -->
        <form id="login-form" class="auth-form space-y-4" role="tabpanel" aria-labelledby="tab-login">
            <div>
                <label for="l-username">Tên đăng nhập</label>
                <input type="text" id="l-username" required autocomplete="username"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label for="l-password">Mật khẩu</label>
                <input type="password" id="l-password" required autocomplete="current-password"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <button type="submit" class="auth-submit w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 rounded-lg text-sm">Đăng nhập</button>
        </form>

        <!-- Đăng ký -->
        <form id="register-form" class="auth-form space-y-4" role="tabpanel" aria-labelledby="tab-register" hidden>
            <div>
                <label for="r-fullname">Họ và tên</label>
                <input type="text" id="r-fullname" required minlength="2" maxlength="100"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
            <div>
                <label for="r-username">Tên đăng nhập</label>
                <input type="text" id="r-username" required minlength="3" maxlength="50" pattern="[a-z0-9_.]{3,50}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-help"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                    placeholder="vd: nhanvien_01">
                <small id="username-help" class="auth-help">3–50 ký tự: chữ thường không dấu, số, dấu chấm (.) hoặc gạch dưới (_).</small>
            </div>
            <div>
                <label for="r-password">Mật khẩu</label>
                <input type="password" id="r-password" required minlength="6" maxlength="100" autocomplete="new-password" aria-describedby="password-help"
                    class="w-full px-3 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <small id="password-help" class="auth-help">Tối thiểu 6 ký tự.</small>
            </div>
            <div>
                <label for="r-role">Vai trò mong muốn</label>
                <select id="r-role" class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm bg-white" aria-describedby="role-help">
                    <option value="worker">Công nhân kho (do Thủ kho/Admin duyệt)</option>
                    <option value="manager">Thủ kho (do Admin duyệt)</option>
                </select>
                <small id="role-help" class="auth-help">Chỉ đăng ký vai trò Công nhân hoặc Thủ kho. Tài khoản cần được phê duyệt trước khi sử dụng.</small>
            </div>
            <button type="submit" class="auth-submit w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 rounded-lg text-sm">Gửi yêu cầu đăng ký</button>
        </form>
    </main>

    <script>
        function show(text, isError) {
            const m = document.getElementById('msg');
            m.textContent = text;
            const kind = /đang chờ/i.test(text) ? 'pending' :
                (/đã bị từ chối/i.test(text) ? 'rejected' :
                    (/đã bị khóa|không còn hoạt động/i.test(text) ? 'locked' : (isError ? 'error' : 'success')));
            m.dataset.kind = kind;
            m.className = 'auth-alert mb-4';
        }

        function switchTab(tab) {
            const isLogin = tab === 'login';
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            document.getElementById('login-form').hidden = !isLogin;
            document.getElementById('register-form').hidden = isLogin;
            loginTab.setAttribute('aria-selected', String(isLogin));
            registerTab.setAttribute('aria-selected', String(!isLogin));
            document.getElementById('msg').className = 'auth-alert hidden mb-4';
        }

        function fieldName(path) {
            const labels = {
                username: 'Tên đăng nhập',
                full_name: 'Họ và tên',
                password: 'Mật khẩu',
                role: 'Vai trò',
                expected_qty: 'Số lượng',
                actual_qty: 'Số lượng thực tế',
                task_id: 'Nhiệm vụ',
                scanned_qr: 'Mã QR ô kệ',
                scanned_barcode: 'Mã vạch sản phẩm',
            };
            const key = String(path || '').split('.').pop();
            return labels[key] || 'Thông tin';
        }

        function validationText(issue) {
            const path = Array.isArray(issue.loc) ? issue.loc.slice(1).join('.') : '';
            const field = fieldName(path);
            const message = String(issue.msg || '');
            if (/field required/i.test(message)) return `${field}: vui lòng nhập thông tin bắt buộc.`;
            if (/at least (\d+) characters?/i.test(message)) return `${field}: cần ít nhất ${message.match(/at least (\d+) characters?/i)[1]} ký tự.`;
            if (/at most (\d+) characters?/i.test(message)) return `${field}: không được vượt quá ${message.match(/at most (\d+) characters?/i)[1]} ký tự.`;
            if (/greater than 0/i.test(message)) return `${field}: phải lớn hơn 0.`;
            if (/valid integer/i.test(message)) return `${field}: vui lòng nhập số nguyên hợp lệ.`;
            if (/valid number/i.test(message)) return `${field}: vui lòng nhập số hợp lệ.`;
            if (/valid date/i.test(message)) return `${field}: vui lòng chọn ngày hợp lệ.`;
            return `${field}: thông tin không hợp lệ.`;
        }

        function errText(data) {
            if (!data) return 'Có lỗi xảy ra';
            const detail = data.detail ?? data.message ?? data;
            if (Array.isArray(detail)) return detail.map(validationText).join(' ');
            if (typeof detail === 'string') return detail;
            if (detail && typeof detail === 'object') return 'Thông tin gửi lên không hợp lệ. Vui lòng kiểm tra lại các trường.';
            return 'Có lỗi xảy ra';
        }

        async function post(url, payload) {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            let data = null;
            try { data = await res.json(); } catch (_) {}
            return { ok: res.ok, data };
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submit = e.currentTarget.querySelector('[type="submit"]');
            submit.disabled = true;
            submit.textContent = 'Đang xác thực…';
            try {
                const { ok, data } = await post('/api/auth/login', {
                    username: document.getElementById('l-username').value,
                    password: document.getElementById('l-password').value,
                });
                if (!ok) return show(errText(data), true);
                localStorage.setItem('wms_token', data.token);
                localStorage.setItem('wms_user', JSON.stringify(data.user));
                location.href = data.user.role === 'worker' ? '/mobile' : '/';
            } catch (_) {
                show('Không kết nối được backend. Hãy kiểm tra FastAPI!', true);
            } finally {
                submit.disabled = false;
                submit.textContent = 'Đăng nhập';
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submit = e.currentTarget.querySelector('[type="submit"]');
            submit.disabled = true;
            submit.textContent = 'Đang gửi yêu cầu…';
            try {
                const { ok, data } = await post('/api/auth/register', {
                    full_name: document.getElementById('r-fullname').value,
                    username: document.getElementById('r-username').value,
                    password: document.getElementById('r-password').value,
                    role: document.getElementById('r-role').value,
                });
                show(errText(data), !ok);
                if (ok) e.target.reset();
            } catch (_) {
                show('Không kết nối được backend. Hãy kiểm tra FastAPI!', true);
            } finally {
                submit.disabled = false;
                submit.textContent = 'Gửi yêu cầu đăng ký';
            }
        });

        // Đã đăng nhập sẵn thì đi thẳng vào hệ thống
        (function () {
            try {
                const u = JSON.parse(localStorage.getItem('wms_user') || 'null');
                if (localStorage.getItem('wms_token') && u) location.href = u.role === 'worker' ? '/mobile' : '/';
            } catch (_) {}
        })();
    </script>
</body>
</html>
