<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WMS Mobile · Quét QR</title>
    {% include "partials/head_assets.html" %}
    <link href="/static/css/mobile.css" rel="stylesheet">
</head>
<body class="mobile-body wms-pending" data-roles="admin,manager,worker" data-page="mobile">
<header class="m-header">
    <div class="me-auto"><div class="brand"><i class="fa-solid fa-warehouse me-1 text-info"></i>WMS Mobile<small><span data-user-name>…</span> • <span data-user-role></span></small></div></div>
    <a href="/" class="btn btn-sm btn-outline-light d-none" id="btnBackOffice" aria-label="Về trang quản lý"><i class="fa-solid fa-gauge-high"></i></a>
    <button class="btn btn-sm btn-outline-light" id="btnRefresh" type="button" aria-label="Làm mới"><i class="fa-solid fa-rotate"></i></button>
    <button class="btn btn-sm btn-outline-danger" data-logout type="button" aria-label="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
</header>

<div class="m-tabs">
    <button class="m-tab active" type="button" data-tab="putaway"><i class="fa-solid fa-arrow-down-to-bracket me-1"></i>Xếp kệ <span class="cnt" id="cntPutaway">0</span></button>
    <button class="m-tab" type="button" data-tab="picking"><i class="fa-solid fa-hand me-1"></i>Lấy hàng <span class="cnt" id="cntPicking">0</span></button>
</div>

<main class="m-list" id="taskList"></main>

<div class="modal fade" id="scanModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="scanTitle">Quét mã</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body"><div id="qrReader"></div><p class="small text-secondary mt-2 mb-0">Đưa mã vào khung hình. Nếu camera không mở được, hãy đóng và nhập mã bằng tay.</p></div>
    </div></div>
</div>

<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="toastContainer" style="z-index: 2000; width: 100%; max-width: 480px"></div>

{% include "partials/scripts_core.html" %}
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/static/js/pages/mobile.js"></script>
</body>
</html>
