{% extends "base.html" %}
{% block content %}
<div class="wms-card">
    <div class="toolbar no-print">
        <div class="grow"><input type="search" id="q" class="form-control" placeholder="Tìm theo mã ô kệ (vd: Z01-A01)..."></div>
        <select id="statusFilter" class="form-select w-auto">
            <option value="">Mọi trạng thái</option><option value="active">Hoạt động</option><option value="maintenance">Bảo trì</option><option value="locked">Đã khóa</option>
        </select>
        <div class="btn-group" role="group">
            <button class="btn btn-outline-primary active" id="viewTable" type="button"><i class="fa-solid fa-table-list"></i> Bảng</button>
            <button class="btn btn-outline-primary" id="viewGrid" type="button"><i class="fa-solid fa-qrcode"></i> Lưới QR</button>
        </div>
        <button class="btn btn-outline-secondary d-none" id="btnPrintAll" type="button"><i class="fa-solid fa-print me-1"></i>In tem QR</button>
        <button class="btn btn-primary" id="btnAdd" type="button"><i class="fa-solid fa-plus me-1"></i>Thêm ô kệ</button>
    </div>
    <div id="tableView" class="table-responsive"><table class="table table-wms">
        <thead><tr><th>Mã ô kệ</th><th>Khu / Dãy / Kệ / Tầng / Ô</th><th style="min-width:200px">Tải trọng</th><th class="num">Số lô</th><th>Trạng thái</th><th></th></tr></thead>
        <tbody id="tbody"></tbody></table></div>
    <div id="gridView" class="qr-grid print-area d-none"></div>
</div>

<div class="modal fade" id="locationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><form class="modal-content" id="locationForm" novalidate>
        <div class="modal-header"><h5 class="modal-title" id="locationModalTitle">Thêm ô kệ</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body"><div class="row g-3">
            <div class="col-12" id="codePreviewBox"><label class="form-label">Mã ô kệ (tự sinh theo BR01)</label><div class="form-control bg-light ledger-ref" id="codePreview">WH01-…</div></div>
            <div class="col-4"><label class="form-label form-text-req" for="fZone">Khu</label><input id="fZone" class="form-control text-uppercase" required maxlength="10" placeholder="Z01"></div>
            <div class="col-4"><label class="form-label form-text-req" for="fAisle">Dãy</label><input id="fAisle" class="form-control text-uppercase" required maxlength="10" placeholder="A01"></div>
            <div class="col-4"><label class="form-label form-text-req" for="fRack">Kệ</label><input id="fRack" class="form-control text-uppercase" required maxlength="10" placeholder="R01"></div>
            <div class="col-4"><label class="form-label form-text-req" for="fLevel">Tầng</label><input id="fLevel" class="form-control text-uppercase" required maxlength="10" placeholder="L1"></div>
            <div class="col-4"><label class="form-label form-text-req" for="fBin">Ô (Bin)</label><input id="fBin" class="form-control text-uppercase" required maxlength="10" placeholder="B01"></div>
            <div class="col-4"><label class="form-label form-text-req" for="fCap">Sức chứa (kg)</label><input id="fCap" type="number" step="0.01" min="1" class="form-control" required></div>
            <div class="col-12"><label class="form-label" for="fStatus">Trạng thái</label>
                <select id="fStatus" class="form-select"><option value="active">Hoạt động</option><option value="maintenance">Bảo trì</option><option value="locked">Khóa</option></select></div>
            <div class="col-12"><div class="form-text" id="fHint"></div></div>
        </div></div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Hủy</button><button type="submit" class="btn btn-primary" id="btnSave">Lưu ô kệ</button></div>
    </form></div>
</div>

<div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
        <div class="modal-header no-print"><h5 class="modal-title">Mã QR ô kệ</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
        <div class="modal-body text-center print-area"><div id="qrBig" class="d-grid place-items-center my-2"></div><div class="ledger-ref fw-bold mt-2" id="qrCode"></div></div>
        <div class="modal-footer no-print"><button class="btn btn-primary" id="btnPrintOne"><i class="fa-solid fa-print me-1"></i>In tem</button></div>
    </div></div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/static/js/pages/locations.js"></script>
{% endblock %}
